---
# infra/ansible/roles/k3s/tasks/main.yml
# Reusable role tasks for k3s installation

- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
    force: false

- name: Run k3s installer
  ansible.builtin.shell:
    cmd: |
      INSTALL_K3S_VERSION="{{ k3s_version | default('v1.29.0+k3s1') }}" \
      K3S_KUBECONFIG_MODE="644" \
      /tmp/k3s-install.sh server \
        --disable traefik \
        --disable servicelb \
        --write-kubeconfig-mode=644 \
        --tls-san "{{ ansible_host }}"
    creates: /usr/local/bin/k3s

- name: Enable and start k3s service
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for k3s API server
  ansible.builtin.wait_for:
    port: 6443
    timeout: 180
    delay: 5
