---
# infra/ansible/inventory/hosts.yml
# Edit node_ip to point at your k3s node (EC2 public IP or local machine)

all:
  children:
    k3s_nodes:
      hosts:
        axon-k3s-dev:
          ansible_host: "{{ lookup('env', 'K3S_NODE_IP') | default('127.0.0.1', true) }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: "~/.ssh/axon-key.pem"
          ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"
          # k3s specific vars
          k3s_version: "v1.29.0+k3s1"
          k3s_role: server

    localhost_group:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars:
    cluster_name: axon
    vault_url: "http://{{ hostvars[groups['k3s_nodes'][0]]['ansible_host'] }}:32200"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('root', true) }}"
