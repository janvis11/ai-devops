---
# infra/ansible/playbooks/install-k3s.yml
# Installs k3s on all nodes in the k3s_nodes inventory group.
# Disables traefik and servicelb (we use our own ingress + metallb).
# Fetches kubeconfig to ~/.kube/axon-config on the Ansible control node.

- name: Install k3s on cluster nodes
  hosts: k3s_nodes
  become: true
  gather_facts: true

  vars:
    k3s_install_script: "https://get.k3s.io"
    kubeconfig_dest: "~/.kube/axon-config"

  pre_tasks:
    - name: Ensure required packages are present
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - jq
          - unzip
          - apt-transport-https
          - ca-certificates
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Ensure required packages are present (RHEL/CentOS)
      ansible.builtin.yum:
        name:
          - curl
          - wget
          - git
          - jq
          - unzip
        state: present
      when: ansible_os_family == "RedHat"

  tasks:
    - name: Download and install k3s (server)
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_script }} | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_KUBECONFIG_MODE="644" \
          sh -s - server \
            --disable traefik \
            --disable servicelb \
            --write-kubeconfig-mode=644 \
            --tls-san "{{ ansible_host }}"
      args:
        creates: /usr/local/bin/k3s
      register: k3s_install_result
      changed_when: k3s_install_result.rc == 0

    - name: Wait for k3s API server to become reachable
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        timeout: 180
        delay: 10
      delegate_to: localhost

    - name: Ensure k3s service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Verify node is Ready
      ansible.builtin.shell: |
        kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes
      register: nodes_output
      until: "'Ready' in nodes_output.stdout"
      retries: 12
      delay: 10

    - name: Print cluster node status
      ansible.builtin.debug:
        msg: "{{ nodes_output.stdout_lines }}"

    - name: Install Helm (if not present)
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Create core namespaces
      ansible.builtin.shell: |
        kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml create namespace {{ item }} --dry-run=client -o yaml | \
          kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f -
      loop:
        - axon-system
        - monitoring
        - apps
        - gitops
        - security
        - backstage
      register: ns_result
      changed_when: "'created' in ns_result.stdout or 'configured' in ns_result.stdout"

    - name: Fetch kubeconfig to control node
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_dest }}"
        flat: true
      become: true

    - name: Replace localhost with node IP in kubeconfig
      ansible.builtin.replace:
        path: "{{ kubeconfig_dest }}"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ ansible_host }}:6443"
      delegate_to: localhost

  post_tasks:
    - name: Print success message
      ansible.builtin.debug:
        msg: |
          k3s installed successfully!
          Kubeconfig saved to: {{ kubeconfig_dest }}
          Export with: export KUBECONFIG={{ kubeconfig_dest }}
          Verify with: kubectl get nodes
