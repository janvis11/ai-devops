---
# infra/ansible/playbooks/bootstrap-secrets.yml
# Bootstraps Vault with the devops-ai-agent policy and writes all app secrets.
# Requires: VAULT_TOKEN, CLAUDE_API_KEY, KAFKA_PASSWORD, PG_PASSWORD env vars.
# Run after: Vault is deployed via Helm and initialized.

- name: Bootstrap Vault secrets for devops.ai platform
  hosts: localhost_group
  gather_facts: false

  vars:
    vault_url: "{{ lookup('env', 'VAULT_ADDR') | default('http://localhost:32200', true) }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('root', true) }}"

  tasks:
    # ── 1. Validate Vault connectivity ─────────────────────────────────────────
    - name: Check Vault health
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/health"
        method: GET
        status_code: [200, 429, 472, 473]
        timeout: 30
      register: vault_health
      retries: 10
      delay: 15
      until: vault_health.status in [200, 429, 472, 473]

    - name: Print Vault status
      ansible.builtin.debug:
        msg: "Vault is reachable. Status: {{ vault_health.status }}"

    # ── 2. Enable KV v2 secrets engine ────────────────────────────────────────
    - name: Enable KV v2 secrets engine at secret/
      community.hashi_vault.vault_write:
        path: sys/mounts/secret
        data:
          type: kv
          options:
            version: "2"
        url: "{{ vault_url }}"
        token: "{{ vault_token }}"
      ignore_errors: true   # fails if already enabled — that's OK

    # ── 3. Write devops.ai application secrets ─────────────────────────────────────
    - name: Write devops.ai config secrets to Vault KV2
      community.hashi_vault.vault_kv2_write:
        path: secret/devops_ai/config
        data:
          claude_api_key: "{{ lookup('env', 'CLAUDE_API_KEY') }}"
          kafka_password: "{{ lookup('env', 'KAFKA_PASSWORD') }}"
          pg_password: "{{ lookup('env', 'PG_PASSWORD') }}"
          pg_connection_string: "postgresql://devops_ai:{{ lookup('env', 'PG_PASSWORD') }}@localhost:5432/devops_ai"
          slack_webhook_url: "{{ lookup('env', 'SLACK_WEBHOOK_URL') | default('', true) }}"
        url: "{{ vault_url }}"
        token: "{{ vault_token }}"
      no_log: true

    - name: Write Kafka SASL credentials to Vault KV2
      community.hashi_vault.vault_kv2_write:
        path: secret/devops_ai/kafka
        data:
          bootstrap_servers: "{{ lookup('env', 'KAFKA_BOOTSTRAP_SERVERS') | default('localhost:9092', true) }}"
          sasl_username: devops.ai
          sasl_password: "{{ lookup('env', 'KAFKA_PASSWORD') }}"
        url: "{{ vault_url }}"
        token: "{{ vault_token }}"
      no_log: true

    # ── 4. Write devops-ai-agent Vault policy ──────────────────────────────────────
    - name: Write devops-ai-agent Vault policy
      community.hashi_vault.vault_policy:
        name: devops-ai-agent
        policy: |
          # devops-ai-agent can read all devops.ai secrets
          path "secret/data/devops_ai/*" {
            capabilities = ["read"]
          }
          path "secret/metadata/devops_ai/*" {
            capabilities = ["list"]
          }
        url: "{{ vault_url }}"
        token: "{{ vault_token }}"

    # ── 5. Enable Kubernetes auth method ──────────────────────────────────────
    - name: Enable Kubernetes auth method
      community.hashi_vault.vault_write:
        path: sys/auth/kubernetes
        data:
          type: kubernetes
        url: "{{ vault_url }}"
        token: "{{ vault_token }}"
      ignore_errors: true   # already enabled is fine

    - name: Configure Kubernetes auth method
      community.hashi_vault.vault_write:
        path: auth/kubernetes/config
        data:
          kubernetes_host: "https://kubernetes.default.svc"
        url: "{{ vault_url }}"
        token: "{{ vault_token }}"

    # ── 6. Create devops-ai-agent Kubernetes role ──────────────────────────────────
    - name: Create Vault role for devops-ai-agent Kubernetes service account
      community.hashi_vault.vault_write:
        path: auth/kubernetes/role/devops-ai-agent
        data:
          bound_service_account_names: "devops-ai-agent"
          bound_service_account_namespaces: "devops-ai-system"
          policies: "devops-ai-agent"
          ttl: "1h"
        url: "{{ vault_url }}"
        token: "{{ vault_token }}"

    - name: Vault bootstrap complete
      ansible.builtin.debug:
        msg: |
          ✅ Vault bootstrap complete!
          Secrets written to: secret/devops_ai/config, secret/devops_ai/kafka
          Policy created: devops-ai-agent
          K8s role created: devops-ai-agent (bound to devops-ai-system/devops-ai-agent SA)
