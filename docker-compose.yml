version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devops_ai
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devops_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    depends_on:
      - postgresql
    environment:
      - DATABASE_URL=postgresql://devops_ai:password@postgresql:5432/devops_ai

  worker:
    build:
      context: ./services/worker
    depends_on:
      - api

  frontend:
    build:
      context: ./services/frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000
