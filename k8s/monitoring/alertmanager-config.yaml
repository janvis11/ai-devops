---
# k8s/monitoring/alertmanager-config.yaml
# AlertmanagerConfig CR — routes all alerts to devops.ai agent webhook.
# Applied in the monitoring namespace, picked up by kube-prometheus-stack.

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: devops-ai-alertmanager-config
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    alertmanagerConfig: devops.ai
spec:
  route:
    # Group alerts by the key fields that devops.ai correlates on
    groupBy:
      - alertname
      - namespace
      - pod
      - severity

    groupWait: 10s        # Wait 10s before sending first notification in a group
    groupInterval: 5m     # Wait 5m before sending updated notifications
    repeatInterval: 1h    # Re-send unresolved alerts every hour

    receiver: devops-ai-webhook

    routes:
      # Critical alerts — send immediately, no wait
      - matchers:
          - name: severity
            value: critical
        receiver: devops-ai-webhook
        groupWait: 0s
        continue: true   # continue to also hit the default receiver

      # Warning alerts — standard grouping
      - matchers:
          - name: severity
            value: warning
        receiver: devops-ai-webhook

      # Suppress watchdog (kube-prometheus heartbeat alert)
      - matchers:
          - name: alertname
            value: Watchdog
        receiver: "null"

  receivers:
    # ── Primary: devops.ai agent FastAPI webhook ────────────────────────────────────
    - name: devops-ai-webhook
      webhookConfigs:
        - url: "http://devops-ai-agent.devops-ai-system.svc.cluster.local:8000/webhook/alertmanager"
          sendResolved: true
          maxAlerts: 50
          httpConfig:
            followRedirects: true

    # ── Null receiver (for suppressed alerts) ──────────────────────────────────
    - name: "null"

  inhibitRules:
    # Inhibit warning if critical for the same pod already firing
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal:
        - namespace
        - pod
