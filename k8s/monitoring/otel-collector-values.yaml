# k8s/monitoring/otel-collector-values.yaml
# OpenTelemetry Collector Helm chart values
# Chart: open-telemetry/opentelemetry-collector

mode: deployment   # single deployment (not daemonset) — receives OTLP pushes

replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.102.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Mount the ConfigMap we applied separately
# (the Helm chart also supports inline config — we use external ConfigMap for clarity)
extraVolumes:
  - name: otel-config
    configMap:
      name: otel-collector-config

extraVolumeMounts:
  - name: otel-config
    mountPath: /conf
    readOnly: true

command:
  name: otelcol-contrib
  extraArgs:
    - "--config=/conf/otel-collector-config.yaml"

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
      interval: 30s

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: "/metrics"
