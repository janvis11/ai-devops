---
# k8s/monitoring/grafana-dashboards/agent-activity-dashboard.yaml
# Grafana Dashboard ConfigMap — devops.ai Agent Activity
# Shows agent action timeline, LLM latency, success rate, Kafka consumer lag.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-activity
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/component: grafana-dashboard
data:
  agent-activity.json: |
    {
      "id": null,
      "uid": "devops-ai-agent-activity",
      "title": "devops.ai — Agent Activity",
      "description": "LangGraph agent action timeline, LLM latency, success rate, Kafka lag",
      "tags": ["devops.ai", "agent", "langgraph", "remediation"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Total Actions (24h)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(devops_ai_agent_actions_total[24h]))",
              "legendFormat": "Actions"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "fixed", "fixedColor": "blue"}}}
        },
        {
          "id": 2,
          "title": "Success Rate",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(devops_ai_agent_actions_total{outcome=\"success\"}[1h])) / sum(rate(devops_ai_agent_actions_total[1h])) * 100",
              "legendFormat": "Success %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 80}, {"color": "green", "value": 95}]},
              "color": {"mode": "thresholds"}
            }
          }
        },
        {
          "id": 3,
          "title": "Pending Actions",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "devops_ai_agent_pending_actions",
              "legendFormat": "Pending"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 5}, {"color": "red", "value": 10}]},
              "color": {"mode": "thresholds"}
            }
          }
        },
        {
          "id": 4,
          "title": "HITL Awaiting Approval",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "expr": "devops_ai_agent_hitl_pending or vector(0)",
              "legendFormat": "Waiting"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]},
              "color": {"mode": "thresholds"}
            }
          }
        },
        {
          "id": 5,
          "title": "Agent Actions per Hour (by type)",
          "type": "barchart",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "sum by (action_type) (increase(devops_ai_agent_actions_total[1h]))",
              "legendFormat": "{{ action_type }}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 6,
          "title": "LLM API Latency (P50 / P95 / P99)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(devops_ai_llm_request_duration_seconds_bucket[5m]))",
              "legendFormat": "P50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(devops_ai_llm_request_duration_seconds_bucket[5m]))",
              "legendFormat": "P95"
            },
            {
              "expr": "histogram_quantile(0.99, rate(devops_ai_llm_request_duration_seconds_bucket[5m]))",
              "legendFormat": "P99"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 7,
          "title": "Kafka Consumer Lag — infra.alerts",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "kafka_consumergroup_lag{topic=\"infra.alerts\", consumergroup=\"devops-ai-alert-consumer\"}",
              "legendFormat": "partition {{ partition }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 50}, {"color": "red", "value": 100}]},
              "color": {"mode": "palette-classic"}
            }
          }
        },
        {
          "id": 8,
          "title": "Action Timeline (last 6h)",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "description": "Recent agent actions from PostgreSQL via Loki logs",
          "targets": [
            {
              "expr": "sum by (action_type, outcome) (increase(devops_ai_agent_actions_total[6h]))",
              "format": "table",
              "instant": true
            }
          ],
          "options": {"sortBy": [{"displayName": "Value", "desc": true}]}
        }
      ]
    }
