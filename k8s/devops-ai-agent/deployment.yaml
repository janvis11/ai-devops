---
# k8s/devops-ai-agent/deployment.yaml
# devops.ai Agent — Kubernetes Deployment + Service
# Deployed by ArgoCD in the devops-ai-system namespace.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ai-agent
  namespace: devops-ai-system
  labels:
    app: devops-ai-agent
    app.kubernetes.io/name: devops-ai-agent
    app.kubernetes.io/component: ai-agent
    app.kubernetes.io/version: "1.0.0"
  annotations:
    # ArgoCD will sync this from Git
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-ai-agent
  template:
    metadata:
      labels:
        app: devops-ai-agent
        app.kubernetes.io/name: devops-ai-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # Vault agent sidecar injects secrets as env vars
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "devops-ai-agent"
        vault.hashicorp.com/agent-inject-secret-config: "devops_ai/data/agent"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "devops_ai/data/agent" -}}
          export CLAUDE_API_KEY="{{ .Data.data.claude_api_key }}"
          export KAFKA_BOOTSTRAP_SERVERS="{{ .Data.data.kafka_brokers }}"
          export POSTGRES_URL="{{ .Data.data.postgres_url }}"
          export SLACK_BOT_TOKEN="{{ .Data.data.slack_token }}"
          export SLACK_SIGNING_SECRET="{{ .Data.data.slack_signing_secret }}"
          {{- end }}
    spec:
      serviceAccountName: devops-ai-agent
      containers:
        - name: devops-ai-agent
          image: ghcr.io/janvis11/devops.ai/agent:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - source /vault/secrets/config && uvicorn agent.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: IN_CLUSTER
              value: "true"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            - name: SLACK_CHANNEL
              value: "#devops-ai-alerts"
            - name: DEDUP_WINDOW_SECONDS
              value: "120"
            - name: CORRELATION_WINDOW_SECONDS
              value: "60"
            - name: VERIFY_TIMEOUT_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
      volumes:
        - name: vault-secrets
          emptyDir: {}

---
# ── Service ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: devops-ai-agent
  namespace: devops-ai-system
  labels:
    app: devops-ai-agent
spec:
  selector:
    app: devops-ai-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# ── ServiceMonitor (Prometheus scrape) ────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-ai-agent
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: devops-ai-agent
  namespaceSelector:
    matchNames:
      - devops-ai-system
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
