apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-ai-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/janvis11/devops.ai
    targetRevision: main
    path: k8s/apps/api
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
