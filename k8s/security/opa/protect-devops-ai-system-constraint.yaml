---
# k8s/security/opa/protect-devops-ai-system-constraint.yaml
# Applies the K8sProtectNamespace constraint to devops-ai-system.
# Only users in system:masters can deploy to devops-ai-system.

apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sProtectNamespace
metadata:
  name: protect-devops-ai-system
  annotations:
    description: Only cluster-admins can deploy to devops-ai-system namespace
spec:
  match:
    kinds:
      - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
        kinds:
          - Pod
          - Deployment
          - StatefulSet
          - DaemonSet
          - Job
          - CronJob
          - Ingress

  enforcementAction: deny

  parameters:
    protectedNamespaces:
      - devops-ai-system
    allowedGroups:
      - system:masters
      - system:cluster-admins
      - argocd-application-controller  # ArgoCD needs to deploy here
